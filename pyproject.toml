[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micrider"
version = "0.1.0"
description = "Write Fairlight track fader automation for lavalier mics, from the recorded audio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "mido>=1.3", "python-rtmidi>=1.5"]

[project.scripts]
micrider = "micrider.cli:main"

[tool.setuptools.packages.find]
include = ["micrider*"]
