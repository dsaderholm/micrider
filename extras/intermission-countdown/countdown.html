<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Good News! Intermission</title>
<!--
  One-minute intermission countdown for GOOD NEWS!
  Every frame is a pure function of time: render.js calls renderFrame(t) and
  screenshots the page. Open it in a browser to scrub with ?t=12.5, or ?play
  to watch it run.
-->
<style>
@font-face { font-family: 'Slab'; src: url(fonts/RobotoSlab-900.woff2); font-weight: 100 900; }
@font-face { font-family: 'Jost'; src: url(fonts/Jost-700.woff2); font-weight: 100 900; }
@font-face { font-family: 'Ops'; src: url(fonts/BlackOpsOne-400.woff2); }
@font-face { font-family: 'Music'; src: url(fonts/NotoMusic-music.woff2); }

:root {
  --cream: #ecbe93;
  --red: #ae1e24;
  --maroon: #5d221b;
  --midred: #932423;
  --ink: #3b1208;
  --shade: #2a0c06;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #c33730; }
.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.abs { position: absolute; left: 0; top: 0; }
img { display: block; position: absolute; }
svg { overflow: visible; }
.dots {
  background-image: radial-gradient(circle at 2px 2px, var(--maroon) 1.6px, transparent 2.1px);
  background-size: 4px 4px;
}

#vignette {
  background:
    radial-gradient(ellipse 75% 85% at 31% 52%, rgba(0,0,0,0) 45%, rgba(70,14,8,0.42) 100%),
    linear-gradient(180deg, rgba(255,190,140,0.07), rgba(0,0,0,0) 30%, rgba(40,8,4,0.18));
}
.note {
  position: absolute; font-family: 'Music'; color: #8f2521; line-height: 1;
  will-change: transform;
}

.archch {
  position: absolute; left: 0; top: 0; font-family: 'Slab'; font-weight: 900; color: var(--cream);
  white-space: pre; line-height: 1;
}

#presents {
  position: absolute; text-align: center; font-family: 'Jost'; font-weight: 700; color: var(--cream);
  text-shadow: 2px 3px 0 rgba(58,14,8,0.55);
}
#presents .l1 { font-size: 44px; letter-spacing: 0.035em; line-height: 1; }
#presents .l2 { font-size: 33px; letter-spacing: 0.06em; line-height: 1; margin-top: 6px; }

#school {
  position: absolute; font-family: 'Jost'; font-weight: 700; color: var(--cream); font-size: 23px;
  letter-spacing: 0.24em; white-space: nowrap; line-height: 1;
}

.lbl { font-family: 'Jost'; font-weight: 700; fill: var(--cream); }
#clockLabel {
  position: absolute; font-family: 'Jost'; font-weight: 700; color: var(--cream); font-size: 29px;
  letter-spacing: 0.28em; white-space: nowrap; line-height: 1;
}
.cell { position: absolute; top: 0; overflow: hidden; }
#fade { background: #000; }
</style>
</head>
<body>
<div id="stage">
  <svg id="rays" class="full" viewBox="0 0 1920 1080"><g id="raysG"></g></svg>
  <div id="vignette" class="full"></div>
  <div id="notes" class="full"></div>

  <div id="lockup" class="full">
    <div id="domeWrap" class="full">
      <svg id="dome" class="full" viewBox="0 0 1920 1080">
        <defs>
          <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <circle cx="2" cy="2" r="1.75" fill="#5d221b"/>
          </pattern>
          <pattern id="dotsDark" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <circle cx="2" cy="2" r="1.85" fill="#3a0f09"/>
          </pattern>
          <clipPath id="aboveBase"><rect id="aboveBaseR" x="0" y="0" width="1920" height="0"/></clipPath>
          <clipPath id="discClip"><circle id="discClipC" cx="0" cy="0" r="0"/></clipPath>
        </defs>
        <g id="domeShadow"></g>
        <g id="domeBody"></g>
      </svg>
      <div id="archText" class="full"></div>
      <div id="school"></div>
    </div>
    <div id="presents"><div class="l1">THEATRE CONSERVATORY</div><div class="l2">PRESENTS</div></div>

    <div id="lShadow" class="full"></div>
    <div id="heartWrapB" class="full">
      <div id="arrowBehind" class="full"></div>
    </div>
    <div id="lOutline" class="full"></div>
    <div id="lFace" class="full"></div>
    <div id="heartWrapF" class="full">
      <div id="arrowFrontShadowClip" class="full"><div id="arrowFrontShadow" class="full"></div></div>
      <div id="arrowFrontClip" class="full"><div id="arrowFront" class="full"></div></div>
    </div>

    <div id="mascotWrap" class="abs">
      <div id="mascotShadow" class="abs dots"></div>
      <img id="mascot" src="">
    </div>
  </div>

  <div id="right" class="full">
    <svg id="pennantSvg" class="full" viewBox="0 0 1920 1080"><g id="pennant"></g></svg>
    <div id="clock" class="abs">
      <svg id="clockSvg" class="abs" width="10" height="10"></svg>
      <div id="clockLabel"></div>
      <div id="digits" class="abs"></div>
    </div>
    <svg id="field" class="full" viewBox="0 0 1920 1080"><g id="fieldG"></g></svg>
  </div>

  <img id="grainTooth" class="full" style="mix-blend-mode: overlay; opacity: 0.55">
  <img id="grainDark" class="full">
  <img id="grainLight" class="full" style="opacity: 0.9">
  <div id="frame" class="full"></div>
  <div id="fade" class="full"></div>
</div>

<script>
'use strict';
const ASSETS = 'assets/1080/';
const NS = 'http://www.w3.org/2000/svg';
const COUNT_FROM = 60;      // seconds on the clock
const COUNT_START = 1;      // the clock holds 1:00 until here, then counts a full minute
const ZERO = COUNT_START + COUNT_FROM;   // 0:00
const END = ZERO + 2;       // clip length, in timecode seconds
const C = { cream: '#ecbe93', red: '#ae1e24', maroon: '#5d221b', midred: '#932423', ink: '#3b1208', shade: '#2a0c06' };

// Layout. Poster pixels map to the frame by P(); OX/OY are whole pixels so the
// pre-rendered halftone in the letter PNGs lands on the frame's pixel grid.
const S = 0.85, OX = 160, OY = 150;
const AX = OX + 505 * S, AY = OY + 760 * S;      // centre of the arch
const P = (x, y) => [OX + x * S, OY + y * S];
const BASE_Y = OY + 752 * S;                      // flat bottom of the dome
const BASE_H = 50;
const RIGHT_CX = 1508;

let M;           // manifest
const E = {};    // elements by role

// ---------------------------------------------------------------- helpers --
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, d) => clamp((t - t0) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeInOutSine = x => -(Math.cos(Math.PI * x) - 1) / 2;
const easeOutBack = (x, k = 1.70158) => 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2);
const bump = x => (x <= 0 || x >= 1) ? 0 : Math.sin(Math.PI * x);
function el(tag, attrs = {}, parent) {
  const e = tag.startsWith('svg:') ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'style') e.style.cssText = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  if (parent) parent.appendChild(e);
  return e;
}
function rng(seed) {   // mulberry32
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function star(cx, cy, r, rot = -90) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const a = (rot + i * 36) * Math.PI / 180, rr = i % 2 ? r * 0.42 : r;
    pts.push((cx + rr * Math.cos(a)).toFixed(2) + ',' + (cy + rr * Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}
function loadImg(img, src) {
  return new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(src); img.src = src; });
}

// ------------------------------------------------------------------ build --
async function build() {
  M = await (await fetch(ASSETS + 'manifest.json')).json();
  const waits = [];

  // sunburst
  const raysG = document.getElementById('raysG');
  const N = 36, R = 2600;
  for (let i = 0; i < N; i++) {
    const a0 = (i / N) * 2 * Math.PI, a1 = ((i + 1) / N) * 2 * Math.PI;
    el('svg:path', {
      d: `M0,0 L${R * Math.cos(a0)},${R * Math.sin(a0)} L${R * Math.cos(a1)},${R * Math.sin(a1)} Z`,
      fill: i % 2 ? '#c63a31' : '#d9493b'
    }, raysG);
  }

  // drifting notes
  const notes = document.getElementById('notes');
  const r = rng(11);
  const glyphs = ['♪', '♫', '♬', '♩', '\u{1D11E}', '♫', '♪'];
  E.notes = [];
  for (let i = 0; i < 16; i++) {
    const n = el('div', { class: 'note', text: glyphs[i % glyphs.length] }, notes);
    const size = 46 + r() * 74;
    n.style.fontSize = size + 'px';
    E.notes.push({ n, x: r() * 1920, y: r() * 1300, v: 14 + r() * 18, sway: 18 + r() * 30,
                   ph: r() * 6.28, rot: -18 + r() * 36, op: 0.45 + r() * 0.35, size });
  }

  // dome (arch band, rings, cream disc) and its base bar
  const A = M.arch, rr = k => A[k] * S;
  document.getElementById('aboveBaseR').setAttribute('height', BASE_Y);
  const dc = document.getElementById('discClipC');
  dc.setAttribute('cx', AX); dc.setAttribute('cy', AY); dc.setAttribute('r', rr('ring_in'));
  const body = document.getElementById('domeBody');
  const domeG = el('svg:g', { 'clip-path': 'url(#aboveBase)' }, body);
  el('svg:circle', { cx: AX, cy: AY, r: rr('ring_out'), fill: C.red }, domeG);
  el('svg:circle', { cx: AX, cy: AY, r: rr('band_out'), fill: C.maroon }, domeG);
  el('svg:circle', { cx: AX, cy: AY, r: rr('band_in'), fill: C.red }, domeG);
  el('svg:circle', { cx: AX, cy: AY, r: rr('ring_in'), fill: C.cream }, domeG);
  // the band's inner shadow on the cream, as in the poster
  const ringW = (A.ring_in - A.shadow_in) * S;
  el('svg:circle', { cx: AX, cy: AY, r: rr('ring_in') - ringW / 2, fill: 'none', stroke: 'url(#dots)',
                     'stroke-width': ringW, 'clip-path': 'url(#discClip)' }, domeG);
  // stars on the band past the lettering
  const bandMid = (rr('band_in') + rr('band_out')) / 2;
  for (const deg of [-84, -72, -60, 60, 72, 84]) {
    const a = (deg - 90) * Math.PI / 180;
    el('svg:polygon', { points: star(AX + bandMid * Math.cos(a), AY + bandMid * Math.sin(a), 15, deg - 90 - 90),
                        fill: C.cream }, domeG);
  }
  // base bar
  const bx0 = AX - rr('ring_out'), bw = 2 * rr('ring_out');
  el('svg:rect', { x: bx0, y: BASE_Y - 1, width: bw, height: BASE_H + 2, fill: C.red }, body);
  el('svg:rect', { x: bx0 + 9, y: BASE_Y + 6, width: bw - 18, height: BASE_H - 12, fill: C.maroon }, body);
  const school = document.getElementById('school');
  school.textContent = 'INTERMOUNTAIN CHRISTIAN SCHOOL';
  // drop shadow of the whole lockup, halftone like everything else on the poster
  const sh = document.getElementById('domeShadow');
  const sv = [11.5 * S, 13 * S];
  const shG = el('svg:g', { transform: `translate(${sv[0]},${sv[1]})`, fill: 'url(#dotsDark)', opacity: 0.85 }, sh);
  el('svg:path', {
    d: `M${AX - rr('ring_out')},${BASE_Y} A${rr('ring_out')},${rr('ring_out')} 0 0 1 ${AX + rr('ring_out')},${BASE_Y} ` +
       `L${AX + rr('ring_out')},${BASE_Y + BASE_H} L${AX - rr('ring_out')},${BASE_Y + BASE_H} Z`
  }, shG);

  // arched title, one element per letter so each can drop in
  await document.fonts.load('900 46px Slab');
  await document.fonts.load('700 40px Jost');
  await document.fonts.load('60px Ops');
  await document.fonts.load('60px Music');
  const title = 'THE MAINSTAGE MUSICAL:';
  const F = 47;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `900 ${F}px Slab`;
  const capH = ctx.measureText('H').actualBoundingBoxAscent;
  const widths = [...title].map(ch => ctx.measureText(ch).width);
  const rBase = bandMid - capH / 2 + 3;          // caps sit a touch high; the extrusion hangs below
  const rMid = rBase + capH / 2;
  const span = 97 * Math.PI / 180 * rMid;
  const ls = (span - widths.reduce((a, b) => a + b, 0)) / (title.length - 1);
  const archText = document.getElementById('archText');
  E.arch = [];
  let cum = 0;
  const total = widths.reduce((a, b) => a + b, 0) + ls * (title.length - 1);
  // extrusion toward the centre, like the poster's
  const ext = [];
  for (let k = 1; k <= 7; k++) ext.push(`${(k * 0.35).toFixed(2)}px ${k}px 0 ${C.shade}`);
  [...title].forEach((ch, i) => {
    const a = (cum + widths[i] / 2 - total / 2) / rMid;
    cum += widths[i] + ls;
    if (ch === ' ') return;
    const wrap = el('div', { class: 'abs', style: `left:${AX}px;top:${AY}px;transform-origin:0 0;transform:rotate(${(a * 180 / Math.PI).toFixed(3)}deg)` }, archText);
    const sp = el('div', { class: 'archch', text: ch }, wrap);
    sp.style.fontSize = F + 'px';
    sp.style.textShadow = ext.join(',');
    // the glyph's baseline centre sits on the circle; it scales about its own middle
    const asc = ctx.measureText(ch).fontBoundingBoxAscent;
    sp.style.left = (-widths[i] / 2) + 'px';
    sp.style.top = (-rBase - asc) + 'px';
    sp.style.transformOrigin = `${widths[i] / 2}px ${asc - capH / 2}px`;
    E.arch.push({ sp, a, i });
  });

  // presents / school lines
  const pres = document.getElementById('presents');
  pres.style.left = (AX - 500) + 'px'; pres.style.width = '1000px';
  pres.style.top = (AY - rr('ring_out') - 112) + 'px';
  school.style.left = '0px'; school.style.top = '0px';
  const sw = school.getBoundingClientRect().width;
  // centred on the bar's open stretch, clear of the mascot's feet
  school.style.left = (AX + 92 - sw / 2 + 0.12 * 23) + 'px';
  school.style.top = (BASE_Y + BASE_H / 2 - 8.5) + 'px';

  // letters: shadow, outline and face layers, each letter its own element
  E.letters = {};
  const order = ['G', 'heart', 'O', 'D', 'N', 'E', 'W', 'S', 'bang'];
  for (const name of order) {
    const p = M.pieces[name];
    const left = OX + Math.round(p.x * S), top = OY + Math.round(p.y * S);
    const origin = `${(p.cx - p.x) * S}px ${(p.cy - p.y) * S}px`;
    const parts = {};
    for (const [layer, id] of [['shadow', 'lShadow'], ['outline', 'lOutline'], ['face', 'lFace']]) {
      const img = el('img', { style: `left:${left}px;top:${top}px;transform-origin:${origin}` }, document.getElementById(id));
      waits.push(loadImg(img, ASSETS + `${name}_${layer}.png`));
      parts[layer] = img;
    }
    E.letters[name] = parts;
  }
  const hp = M.pieces.heart;
  const [hcx, hcy] = P(hp.cx, hp.cy);
  for (const id of ['heartWrapB', 'heartWrapF']) document.getElementById(id).style.transformOrigin = `${hcx}px ${hcy}px`;

  // arrow: one copy behind the heart, one in front clipped at the point of entry
  const ar = M.arrow;
  const [tx, ty] = P(ar.tail[0], ar.tail[1]);
  const ang = ar.angle;
  const ux = Math.cos(ang * Math.PI / 180), uy = Math.sin(ang * Math.PI / 180);
  E.arrow = { tx, ty, ang, ux, uy, pierce: ar.pierce_s * S, len: ar.len * S };
  function arrowEl(parent, sil) {
    const box = el('div', { class: 'abs' }, parent);
    box.style.left = (tx + ar.s_min * S) + 'px';
    box.style.top = (ty + ar.q_min * S) + 'px';
    box.style.transformOrigin = `${-ar.s_min * S}px ${-ar.q_min * S}px`;
    if (sil) {
      const d = el('div', { class: 'abs dots' }, box);
      d.style.width = Math.round(ar.len * S) + 'px';
      d.style.height = Math.round(ar.thick * S) + 'px';
      d.style.webkitMaskImage = d.style.maskImage = `url(${ASSETS}arrow_sil.png)`;
      d.style.webkitMaskSize = d.style.maskSize = '100% 100%';
    } else {
      const img = el('img', {}, box);
      img.style.width = Math.round(ar.len * S) + 'px';
      img.style.height = Math.round(ar.thick * S) + 'px';
      waits.push(loadImg(img, ASSETS + 'arrow.png'));
      // speed lines trailing the fletching while it flies
      const streak = el('div', { class: 'abs' }, box);
      streak.style.cssText += `left:${-360}px;top:${-ar.q_min * S - 9}px;width:360px;height:18px;` +
        `background:linear-gradient(90deg, rgba(236,190,147,0), rgba(236,190,147,0.55));` +
        `clip-path:polygon(0 45%, 100% 0, 100% 100%, 0 55%)`;
      box._streak = streak;
    }
    return box;
  }
  const av = [ar.shadow[0] * S, ar.shadow[1] * S];
  const behindShadow = el('div', { class: 'full', style: `transform:translate(${av[0]}px,${av[1]}px)` }, document.getElementById('arrowBehind'));
  E.arrowEls = [arrowEl(behindShadow, true), arrowEl(document.getElementById('arrowBehind'), false)];
  const fsh = document.getElementById('arrowFrontShadow');
  fsh.style.transform = `translate(${av[0]}px,${av[1]}px)`;
  E.arrowEls.push(arrowEl(fsh, true), arrowEl(document.getElementById('arrowFront'), false));
  // clip: the half of the plane behind the point where the shaft enters the heart
  const px = tx + ux * E.arrow.pierce, py = ty + uy * E.arrow.pierce;
  const nx = -uy, ny = ux, B = 4000;
  const poly = (ox, oy) => 'polygon(' + [
    [px + ox + nx * B, py + oy + ny * B], [px + ox - nx * B, py + oy - ny * B],
    [px + ox - nx * B - ux * B, py + oy - ny * B - uy * B], [px + ox + nx * B - ux * B, py + oy + ny * B - uy * B]
  ].map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',') + ')';
  document.getElementById('arrowFrontClip').style.clipPath = poly(0, 0);
  document.getElementById('arrowFrontShadowClip').style.clipPath = poly(av[0], av[1]);

  // mascot
  const mm = M.mascot;
  const mw = document.getElementById('mascotWrap');
  const [mx, my] = P(mm.x, mm.y);
  const mwPx = Math.round(mm.w * S), mhPx = Math.round(mm.h * S);
  mw.style.left = Math.round(mx) + 'px'; mw.style.top = Math.round(my) + 'px';
  mw.style.width = mwPx + 'px'; mw.style.height = mhPx + 'px';
  mw.style.transformOrigin = `${0.52 * mwPx}px ${mhPx}px`;
  const mimg = document.getElementById('mascot');
  mimg.style.width = mwPx + 'px'; mimg.style.height = mhPx + 'px';
  waits.push(loadImg(mimg, ASSETS + 'mascot.png'));
  const msh = document.getElementById('mascotShadow');
  msh.style.cssText += `left:${Math.round(10 * S)}px;top:${Math.round(11 * S)}px;width:${mwPx}px;height:${mhPx}px;opacity:.85;` +
    `-webkit-mask-image:url(${ASSETS}mascot.png);mask-image:url(${ASSETS}mascot.png);-webkit-mask-size:100% 100%;mask-size:100% 100%`;

  buildRight();

  waits.push(loadImg(document.getElementById('grainTooth'), ASSETS + 'grain_tooth.png'));
  waits.push(loadImg(document.getElementById('grainDark'), ASSETS + 'grain_dark.png'));
  waits.push(loadImg(document.getElementById('grainLight'), ASSETS + 'grain_light.png'));
  await Promise.all(waits);
  await document.fonts.ready;
}

// ------------------------------------------------------ right-hand column --
function buildRight() {
  // pennant, as on the poster's SHOW TIMES
  const g = document.getElementById('pennant');
  const L = 668, H = 192;
  const px = RIGHT_CX - 318, py = 228;
  E.pennant = { g, px, py };
  const shadow = el('svg:g', { transform: 'translate(13,15)', opacity: 0.85 }, g);
  el('svg:polygon', { points: `0,0 ${L},${H / 2} 0,${H}`, fill: 'url(#dotsDark)' }, shadow);
  el('svg:rect', { x: -15, y: -14, width: 17, height: H + 28, fill: 'url(#dotsDark)' }, shadow);
  el('svg:polygon', { points: `0,0 ${L},${H / 2} 0,${H}`, fill: C.midred }, g);
  // inner border: each edge moved inward by `inset`
  const inset = 11, k = (H / 2) / L, e = inset * Math.sqrt(1 + k * k);
  const tipX = (H / 2 - e) / k;
  el('svg:polygon', { points: `${inset},${k * inset + e} ${tipX},${H / 2} ${inset},${H - k * inset - e}`,
                      fill: 'none', stroke: C.cream, 'stroke-width': 3 }, g);
  for (const y of [22, H - 46]) el('svg:rect', { x: 21, y, width: 3, height: 24, fill: C.cream }, g);
  // stick
  el('svg:rect', { x: -15, y: -14, width: 17, height: H + 28, rx: 3, fill: C.cream, stroke: C.maroon, 'stroke-width': 3 }, g);
  // INTERMISSION, fitted inside the triangle
  const fs = 72, capH = fs * 0.72;
  const x0 = 44;
  const xEnd = L * (1 - (capH + 18) / H);
  const t = el('svg:text', { x: x0, y: H / 2 + capH / 2, fill: C.cream, 'font-family': 'Ops', 'font-size': fs,
                             textLength: xEnd - x0, lengthAdjust: 'spacingAndGlyphs', text: 'INTERMISSION' }, g);
  t.style.letterSpacing = '0px';

  // the clock: a dark card, tilted like the poster's show-times box
  const clock = document.getElementById('clock');
  const W = 600, Hc = 322;
  const cx = RIGHT_CX - W / 2 + 6, cy = 470;
  clock.style.left = cx + 'px'; clock.style.top = cy + 'px';
  clock.style.width = W + 'px'; clock.style.height = Hc + 'px';
  clock.style.transformOrigin = `${W / 2}px ${Hc / 2}px`;
  E.clock = { el: clock, W, H: Hc };
  const cs = document.getElementById('clockSvg');
  cs.setAttribute('width', W); cs.setAttribute('height', Hc);
  cs.style.left = '0px'; cs.style.top = '0px';
  el('svg:rect', { x: 14, y: 16, width: W, height: Hc, fill: 'url(#dotsDark)', opacity: 0.85 }, cs);
  el('svg:rect', { x: 0, y: 0, width: W, height: Hc, fill: C.ink }, cs);
  el('svg:rect', { x: 12, y: 12, width: W - 24, height: Hc - 24, fill: 'none', stroke: C.cream, 'stroke-width': 2, opacity: 0.55 }, cs);
  const lbl = document.getElementById('clockLabel');
  lbl.textContent = 'ACT TWO BEGINS IN';
  const lw = lbl.getBoundingClientRect().width;
  lbl.style.left = ((W - lw) / 2 + 0.14 * 29) + 'px';
  lbl.style.top = '40px';

  // digits: one clipped cell per character, so a changing digit can roll
  const dg = document.getElementById('digits');
  const FS = 232;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `700 ${FS}px Jost`;
  let dw = 0;
  for (const d of '0123456789') dw = Math.max(dw, ctx.measureText(d).width);
  dw = Math.ceil(dw) + 2;
  const colW = Math.ceil(ctx.measureText(':').width) + 6;
  const capD = ctx.measureText('0').actualBoundingBoxAscent;
  const cellH = Math.ceil(capD + 30);
  const widths = [dw, colW, dw, dw];
  const totalW = widths.reduce((a, b) => a + b, 0);
  dg.style.left = ((W - totalW) / 2) + 'px';
  dg.style.top = (Hc / 2 + 34 - cellH / 2) + 'px';
  dg.style.width = totalW + 'px'; dg.style.height = cellH + 'px';
  dg.style.transformOrigin = `${totalW / 2}px ${cellH / 2}px`;
  E.cells = [];
  let x = 0;
  const base = cellH - 15;
  widths.forEach((w, i) => {
    const c = el('div', { class: 'cell', style: `left:${x}px;width:${w}px;height:${cellH}px` }, dg);
    const svg = el('svg:svg', { width: w, height: cellH, style: 'position:absolute;left:0;top:0;overflow:hidden' }, c);
    const mk = () => el('svg:text', { x: w / 2, y: base, 'text-anchor': 'middle', 'font-family': 'Jost',
                                      'font-weight': 700, 'font-size': FS, fill: C.cream }, svg);
    E.cells.push({ c, a: mk(), b: mk(), h: cellH });
    x += w;
  });
  E.digits = dg;

  // yard-line progress: the ball runs the length of the field in a minute
  const fg = document.getElementById('fieldG');
  const fx = RIGHT_CX - 280, fy = 870, fw = 520;
  E.field = { fx, fy, fw };
  el('svg:rect', { x: fx + 3, y: fy + 4, width: fw, height: 12, rx: 6, fill: 'url(#dotsDark)', opacity: 0.8 }, fg);
  el('svg:rect', { x: fx, y: fy, width: fw, height: 12, rx: 6, fill: C.maroon, stroke: C.cream, 'stroke-width': 2.5 }, fg);
  E.fieldFill = el('svg:rect', { x: fx + 2, y: fy + 2, width: 0, height: 8, rx: 4, fill: C.cream }, fg);
  const yards = ['10', '20', '30', '40', '50', '40', '30', '20', '10'];
  for (let i = 1; i <= 9; i++) {
    const xx = fx + fw * i / 10;
    el('svg:rect', { x: xx - 1.25, y: fy + 18, width: 2.5, height: 9, fill: C.cream, opacity: 0.85 }, fg);
    el('svg:text', { x: xx, y: fy + 47, 'text-anchor': 'middle', class: 'lbl', 'font-size': 17, text: yards[i - 1],
                     'letter-spacing': '0.04em', opacity: 0.85 }, fg);
  }
  // goal posts
  const gx = fx + fw + 40, gy = fy + 6;
  E.goal = el('svg:g', {}, fg);
  const gp = (d) => el('svg:path', { d, fill: 'none', stroke: C.cream, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, E.goal);
  el('svg:path', { d: `M${gx + 3},${gy + 30} L${gx + 3},${gy + 4} M${gx - 24},${gy - 52} L${gx - 24},${gy + 4} L${gx + 30},${gy + 4} L${gx + 30},${gy - 52}`,
                   fill: 'none', stroke: 'url(#dotsDark)', 'stroke-width': 6, opacity: 0.8, transform: 'translate(4,5)' }, E.goal);
  gp(`M${gx},${gy + 30} L${gx},${gy}`);
  gp(`M${gx - 27},${gy - 56} L${gx - 27},${gy} L${gx + 27},${gy} L${gx + 27},${gy - 56}`);
  E.goalPos = [gx, gy];
  // the ball
  E.ball = el('svg:g', {}, fg);
  el('svg:ellipse', { cx: 3, cy: 4, rx: 25, ry: 15, fill: 'url(#dotsDark)', opacity: 0.8 }, E.ball);
  el('svg:ellipse', { cx: 0, cy: 0, rx: 25, ry: 15, fill: '#8f2a22', stroke: C.maroon, 'stroke-width': 3 }, E.ball);
  el('svg:path', { d: 'M-9,-3 L9,-3 M-6,-7 L-6,1 M-2,-7 L-2,1 M2,-7 L2,1 M6,-7 L6,1', stroke: C.cream, 'stroke-width': 2, 'stroke-linecap': 'round' }, E.ball);
  el('svg:path', { d: 'M-17,-9 Q-19,0 -17,9 M17,-9 Q19,0 17,9', stroke: C.cream, 'stroke-width': 3, fill: 'none' }, E.ball);
}

// ------------------------------------------------------------------ frame --
function clockValue(t) { return clamp(COUNT_FROM - Math.floor(t - COUNT_START), 0, COUNT_FROM); }
function fmt(n) { return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); }

function renderFrame(t) {
  // background
  document.getElementById('raysG').setAttribute('transform', `translate(${AX},${AY}) rotate(${-8 + t * 2.4})`);
  const notesIn = easeOutCubic(prog(t, 0.2, 1.4));
  for (const n of E.notes) {
    const y = ((n.y - n.v * t) % 1300 + 1300) % 1300 - 150;
    const x = n.x + Math.sin(n.ph + t * 0.6) * n.sway;
    const rot = n.rot + Math.sin(n.ph * 1.7 + t * 0.9) * 9;
    n.n.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${rot.toFixed(2)}deg)`;
    n.n.style.opacity = (n.op * notesIn).toFixed(3);
  }

  // dome
  const dIn = prog(t, 0.1, 0.75);
  const dsc = lerp(0.55, 1, easeOutBack(dIn, 1.5));
  const dome = document.getElementById('domeWrap');
  dome.style.transformOrigin = `${AX}px ${AY}px`;
  dome.style.transform = `scale(${dsc.toFixed(4)})`;
  dome.style.opacity = clamp(dIn * 3).toFixed(3);
  for (const a of E.arch) {
    const p = prog(t, 0.38 + a.i * 0.026, 0.42);
    const sc = lerp(1.6, 1, easeOutBack(p, 1.8));
    const lift = (1 - easeOutCubic(p)) * 40;
    a.sp.style.transform = `translateY(${(-lift).toFixed(2)}px) scale(${sc.toFixed(4)})`;
    a.sp.style.opacity = clamp(p * 2.5).toFixed(3);
  }
  const pr = prog(t, 0.3, 0.6);
  const pres = document.getElementById('presents');
  pres.style.opacity = easeOutCubic(pr).toFixed(3);
  pres.style.transform = `translateY(${((1 - easeOutCubic(pr)) * -24).toFixed(2)}px)`;

  // heart: pops in, thumps when the arrow lands, then beats now and then
  const hitT = 1.62;
  let heart = 1 + 0.10 * bump((t - hitT) / 0.32);
  if (t > 4) {
    const x = (t - 4) % 4.5;
    heart *= 1 + 0.055 * bump(x / 0.2) + 0.035 * bump((x - 0.24) / 0.2);
  }
  // letters
  const starts = { G: 0.5, heart: 0.56, O: 0.62, D: 0.68, N: 0.82, E: 0.88, W: 0.94, S: 1.0, bang: 1.08 };
  for (const [name, parts] of Object.entries(E.letters)) {
    const p = prog(t, starts[name], 0.5);
    let sc = p <= 0 ? 0 : easeOutBack(p, 2.6);
    let rot = (1 - easeOutCubic(p)) * (name === 'bang' ? 22 : -14);
    if (name === 'heart') sc *= heart;
    if (name === 'bang' && t > 2) rot += 2.5 * Math.sin((t - 2) * 2.2) * Math.min(1, (t - 2));  // the ! sways
    const tr = `rotate(${rot.toFixed(3)}deg) scale(${Math.max(sc, 0.0001).toFixed(4)})`;
    for (const img of Object.values(parts)) {
      img.style.transform = tr;
      img.style.opacity = clamp(p * 5).toFixed(3);
    }
  }
  const hs = `scale(${heart.toFixed(4)})`;
  document.getElementById('heartWrapB').style.transform = hs;
  document.getElementById('heartWrapF').style.transform = hs;

  // arrow: flies in along its own axis, sticks, quivers
  const fly = prog(t, hitT - 0.36, 0.36);
  const D0 = 900 * S;
  const d = D0 * (1 - fly);
  const since = t - hitT;
  const wob = since > 0 ? 4.5 * Math.exp(-since * 5.5) * Math.sin(since * 2 * Math.PI * 6.5) : 0;
  const pz = E.arrow.pierce;
  const tr = `rotate(${E.arrow.ang}deg) translateX(${(-d).toFixed(2)}px) translateX(${pz}px) rotate(${wob.toFixed(3)}deg) translateX(${-pz}px)`;
  const vis = fly > 0 ? 1 : 0;
  const streak = since < 0 ? 1 : clamp(1 - since / 0.18);
  for (const a of E.arrowEls) {
    a.style.transform = tr;
    a.style.opacity = vis;
    if (a._streak) a._streak.style.opacity = (streak * vis).toFixed(3);
  }

  // mascot: hops on, then sways to the music
  const mIn = prog(t, 0.9, 0.62);
  let my = (1 - easeOutBack(mIn, 1.6)) * 330;
  let mr = (1 - easeOutCubic(mIn)) * -16;
  if (t > 1.52) {
    const ph = (t - 1.52) * 2 * Math.PI / 2.4;
    const ramp = Math.min(1, (t - 1.52) / 0.8);
    mr += 3.2 * Math.sin(ph) * ramp;
    my -= 7 * Math.abs(Math.sin(ph)) * ramp;
  }
  // a celebratory jump when the clock runs out
  my -= 46 * bump((t - ZERO) / 0.55) + 18 * bump((t - ZERO - 0.55) / 0.3);
  const mw = document.getElementById('mascotWrap');
  mw.style.transform = `translateY(${my.toFixed(2)}px) rotate(${mr.toFixed(3)}deg)`;
  mw.style.opacity = clamp(mIn * 7).toFixed(3);

  renderRight(t);

  // fades
  let fade = 1 - easeInOutSine(prog(t, 0, 0.55));
  fade = Math.max(fade, easeInOutSine(prog(t, END - 1.0, 1.0)));
  document.getElementById('fade').style.opacity = fade.toFixed(4);
}

function renderRight(t) {
  // pennant swings down from its stick
  const pIn = prog(t, 0.55, 0.8);
  let pr = lerp(-58, -5, easeOutBack(pIn, 1.9));
  if (t > 1.35) pr += 1.3 * Math.sin((t - 1.35) * 2 * Math.PI / 3.2) * Math.min(1, (t - 1.35));
  const { g, px, py } = E.pennant;
  g.setAttribute('transform', `translate(${px},${py}) rotate(${pr.toFixed(3)})`);
  g.setAttribute('opacity', clamp(pIn * 4).toFixed(3));

  // clock card
  const cIn = prog(t, 0.78, 0.6);
  const ce = E.clock.el;
  const n = clockValue(t);
  let pulse = 1;
  if (t >= COUNT_START + 1 && t < ZERO + 1 && n <= 10) {
    pulse += 0.045 * Math.pow(1 - clamp((t - Math.floor(t)) / 0.35), 2);
  }
  pulse += 0.07 * bump((t - ZERO) / 0.5);
  ce.style.transform = `translateY(${((1 - easeOutCubic(cIn)) * 90).toFixed(2)}px) rotate(-2.4deg) scale(${pulse.toFixed(4)})`;
  ce.style.opacity = clamp(cIn * 2.5).toFixed(3);

  // digits roll up as they change
  const k = Math.floor(t);
  const now = fmt(clockValue(t)), before = fmt(clockValue(k - 0.001));
  const q = easeInOutCubic(clamp((t - k) / 0.42));
  const pad = s => s.padStart(4, ' ');
  const A = pad(before), B = pad(now);
  E.cells.forEach((c, i) => {
    const h = c.h;
    if (A[i] === B[i] || q >= 1) {
      c.a.textContent = B[i]; c.a.setAttribute('transform', ''); c.a.setAttribute('opacity', 1);
      c.b.textContent = ''; c.b.setAttribute('opacity', 0);
    } else {
      c.a.textContent = A[i]; c.a.setAttribute('transform', `translate(0,${(-q * h * 0.8).toFixed(2)})`); c.a.setAttribute('opacity', (1 - q).toFixed(3));
      c.b.textContent = B[i]; c.b.setAttribute('transform', `translate(0,${((1 - q) * h * 0.8).toFixed(2)})`); c.b.setAttribute('opacity', q.toFixed(3));
    }
  });

  // field
  const fIn = prog(t, 1.0, 0.5);
  document.getElementById('field').style.opacity = easeOutCubic(fIn).toFixed(3);
  const { fx, fy, fw } = E.field;
  const p = clamp((t - COUNT_START) / COUNT_FROM);
  E.fieldFill.setAttribute('width', Math.max(0, (fw - 4) * p).toFixed(2));
  const bx = fx + fw * p + 40 * easeOutCubic(prog(t, ZERO, 0.5));
  const hop = Math.abs(Math.sin(t * Math.PI * 1.0)) * 5;
  const spin = Math.sin(t * 2.1) * 10 - 360 * easeOutCubic(prog(t, ZERO, 0.6));
  const lift = 30 * bump(prog(t, ZERO, 0.6));
  E.ball.setAttribute('transform', `translate(${bx.toFixed(2)},${(fy + 6 - 22 - hop - lift).toFixed(2)}) rotate(${spin.toFixed(2)})`);
  // goal posts flash when it's good
  const flash = bump(prog(t, ZERO + 0.25, 0.5));
  const [gx, gy] = E.goalPos;
  E.goal.setAttribute('transform', `translate(${gx},${gy}) scale(${(1 + 0.18 * flash).toFixed(4)}) translate(${-gx},${-gy})`);
}

// ------------------------------------------------------------------ entry --
window.ready = build().then(() => {
  const qs = new URLSearchParams(location.search);
  if (qs.has('play')) {
    const t0 = performance.now();
    const tick = () => { renderFrame(((performance.now() - t0) / 1000) % END); requestAnimationFrame(tick); };
    tick();
  } else {
    renderFrame(parseFloat(qs.get('t') || '30'));
  }
});
window.renderFrame = renderFrame;
window.CLIP_END = END;
</script>
</body>
</html>
